## ref: https://python-poetry.org/docs/pyproject/
[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "aws-resource-inventory"
version = "0.2.0"
description = "AWS multi-service resource inventory with tag-based filtering and advanced optimizations"
authors = [
    {name = "Ishan Sharma"}
]
readme = "README.md"
license = "MIT"
keywords = ["aws", "scanner", "cloud", "infrastructure", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.40.34",
    "botocore>=1.40.34",
    "typer>=0.17.4",
    "rich>=14.1.0",
    "pyfiglet>=1.0.4",
    # Keep these as they're transitive dependencies
    "click>=8.3.0",      # Required by typer
    "setuptools>=80.9.0", # Required by build system
    "urllib3>=2.5.0",    # Required by boto3
]

[project.urls]
Homepage = "https://github.com/ishuar/aws-resource-inventory"
Repository = "https://github.com/ishuar/aws-resource-inventory"

[project.scripts]
aws-inventory = "aws_resource_inventory.cli:app"
aws-resource-inventory = "aws_resource_inventory.cli:app"

[tool.poetry]
# One package, so the wheel claims exactly one top-level name in
# site-packages (see docs/adr/0004). tests/test_packaging.py pins that
# every console-script module is listed here.
packages = [
    {include = "aws_resource_inventory"},
]
[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-cov = "^7.0.0"
black = "^25.7.0"
flake8 = "^6.0.0"
mypy = "^1.18.0"
pre-commit = "^4.3.0"
moto = "^5.2.2"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.history
  | \.pytest_cache
  | \.ruff_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
explicit_package_bases = true
ignore_missing_imports = true
files = [
          'aws_resource_inventory/*.py',
          'aws_resource_inventory/lib/*.py',
          'aws_resource_inventory/services/*.py',
          'tests/*.py'
]
exclude = [
          '.*cache/**',
          '.venv/**'
]

[[tool.mypy.overrides]]
# pytest decorators (@fixture, @mark.parametrize) resolve as untyped in the
# pre-commit mypy environment, which has no pytest installed.
module = "tests.*"
disallow_untyped_decorators = false
[tool.ruff.lint]
# Deliberately curated rule set (rules are pinned explicitly so hook
# version bumps can never change what gets linted):
#   E/W  pycodestyle          F  pyflakes           B  bugbear (bug patterns)
#   UP   pyupgrade            SIM flake8-simplify   DTZ naive-datetime bans
#   BLE  blind-except bans    RUF ruff-native checks
# Import order stays owned by isort (so "I" is intentionally absent).
select = ["E", "W", "F", "B", "UP", "SIM", "DTZ", "BLE", "RUF"]
ignore = [
  "E501", # line length is owned by black
]
# The CLI deliberately renders "20 regions × 6 services" with a real
# multiplication sign; it is display typography, not a confusable typo.
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
# typer declares CLI options as function-call defaults by design
"aws_resource_inventory/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Scope matches what was measured before the package restructure: the
# library and the scanners. cli.py and orchestrator.py stay unmeasured
# until the CLI-level tests on the roadmap land — folding them in here
# would report a coverage cliff that no code change caused.
addopts = "--verbose --tb=short --strict-markers --cov=aws_resource_inventory/lib --cov=aws_resource_inventory/services --cov-report=term-missing"

[tool.coverage.run]
source = ["aws_resource_inventory/lib", "aws_resource_inventory/services"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/build/*",
    "*/dist/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
